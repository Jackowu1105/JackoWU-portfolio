<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A2A599"/>
      <stop offset="1" stop-color="#213058"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#ac)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">MOTION LANGUAGE</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">One motion language, two registers</text>

  <!-- Shared motion layer -->
  <rect x="40" y="116" width="720" height="52" rx="12" fill="#213058"/>
  <text x="400" y="148" font-size="14" fill="#fff" text-anchor="middle" font-weight="600" letter-spacing="1">SHARED MOTION LAYER — pacing · transitions · visual treatment</text>

  <!-- Corporate card -->
  <rect x="40" y="192" width="345" height="140" rx="14" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <rect x="60" y="210" width="96" height="22" rx="6" fill="#E0E1D3"/>
  <text x="108" y="225" font-size="10" letter-spacing="1.5" fill="#213058" text-anchor="middle" font-weight="700">CORPORATE</text>
  <text x="60" y="258" font-size="17" font-weight="700" fill="#1A1410">2026 brand video</text>
  <text x="60" y="282" font-size="13" fill="#5A554F">The company story in motion —</text>
  <text x="60" y="302" font-size="13" fill="#5A554F">credible, forward-looking, flagship.</text>

  <!-- Festive card -->
  <rect x="415" y="192" width="345" height="140" rx="14" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <rect x="435" y="210" width="96" height="22" rx="6" fill="#E0E1D3"/>
  <text x="483" y="225" font-size="10" letter-spacing="1.5" fill="#213058" text-anchor="middle" font-weight="700">FESTIVE</text>
  <text x="435" y="258" font-size="17" font-weight="700" fill="#1A1410">Christmas 2024/25 · LNY 2026</text>
  <text x="435" y="282" font-size="13" fill="#5A554F">Warm, quick, social-ready —</text>
  <text x="435" y="302" font-size="13" fill="#5A554F">the same language, lighter register.</text>

  <text x="40" y="360" font-size="13" fill="#5A554F">Muted warm neutral palette — calm enough for the film, warm enough for festive.</text>

  <!-- Palette -->
  <g font-size="11" fill="#8A8480">
    <rect x="40" y="380" width="22" height="22" rx="6" fill="#E0E1D3"/>
    <text x="72" y="396">Sage</text>
    <rect x="140" y="380" width="22" height="22" rx="6" fill="#A2A599"/>
    <text x="172" y="396">Sage Light</text>
    <rect x="250" y="380" width="22" height="22" rx="6" fill="#667077"/>
    <text x="282" y="396">Blue-Grey</text>
    <rect x="370" y="380" width="22" height="22" rx="6" fill="#213058"/>
    <text x="402" y="396">Navy</text>
  </g>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">AIFT · Corporate and seasonal motion graphics — content changes, the motion stays unified</text>
</svg>
