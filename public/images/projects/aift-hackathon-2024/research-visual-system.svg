<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9BC7F5"/>
      <stop offset="1" stop-color="#927BDE"/>
    </linearGradient>
    <linearGradient id="sys" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4566D7"/>
      <stop offset="1" stop-color="#927BDE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#ac)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">VISUAL SYSTEM</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">One system, from wall to paper</text>

  <!-- LED wall backdrop -->
  <rect x="40" y="118" width="720" height="64" rx="12" fill="url(#sys)"/>
  <text x="400" y="144" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="1">LED WALL BACKDROP — 2048×1280</text>
  <text x="400" y="166" font-size="12" fill="#fff" text-anchor="middle" opacity="0.85">the main anchor — read from across the hall</text>

  <!-- Connector -->
  <line x1="400" y1="184" x2="400" y2="208" stroke="#927BDE" stroke-width="2"/>

  <!-- Entrance signage -->
  <rect x="140" y="210" width="520" height="58" rx="12" fill="url(#sys)"/>
  <text x="400" y="236" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="1">ENTRANCE TV SIGNING — 1920×1080 · 3840×2106</text>
  <text x="400" y="258" font-size="12" fill="#fff" text-anchor="middle" opacity="0.85">legible at distance — guiding participants to the venue</text>

  <!-- Connector -->
  <line x1="400" y1="270" x2="400" y2="292" stroke="#927BDE" stroke-width="2"/>

  <!-- Certificate -->
  <rect x="240" y="294" width="320" height="50" rx="12" fill="url(#sys)"/>
  <text x="400" y="326" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="1">CERTIFICATE — the keepsake</text>

  <text x="40" y="362" font-size="13" fill="#5A554F">Same blue-purple system at every scale — energetic for a hackathon, credible for an AIFT event.</text>

  <!-- Palette -->
  <g font-size="11" fill="#8A8480">
    <rect x="40" y="380" width="22" height="22" rx="6" fill="#9BC7F5"/>
    <text x="72" y="396">Sky Blue</text>
    <rect x="150" y="380" width="22" height="22" rx="6" fill="#4566D7"/>
    <text x="182" y="396">Blue</text>
    <rect x="260" y="380" width="22" height="22" rx="6" fill="#927BDE"/>
    <text x="292" y="396">Purple</text>
    <rect x="370" y="380" width="22" height="22" rx="6" fill="#0F1F82"/>
    <text x="402" y="396">Navy</text>
  </g>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">AIFT Hackathon 2024 · Blue-purple tech system — one system, many configurations</text>
</svg>
