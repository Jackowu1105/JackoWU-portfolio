<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#304666"/>
      <stop offset="1" stop-color="#37848A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">TASK PRIORITY · CONTROLLER WORKFLOW</text>
  <text x="40" y="92" font-size="22" font-weight="700" fill="#1A1410">What a controller needs, and when</text>

  <g font-size="11" letter-spacing="1.5" font-weight="600" fill="#8A8480">
    <text x="40" y="130">INFORMATION</text>
    <text x="300" y="130">PRIORITY IN THE SCAN</text>
    <text x="460" y="130">PHASE 2 — BEFORE</text>
    <text x="632" y="130">PHASE 3 — AFTER</text>
  </g>

  <!-- Row 1 -->
  <rect x="40" y="144" width="720" height="62" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="174" font-size="13.5" font-weight="600" fill="#1A1410">Body type — Wide / Narrow</text>
  <text x="56" y="192" font-size="11.5" fill="#8A8480">Drives PTS events &amp; ground crew</text>
  <text x="300" y="182" font-size="12.5" fill="#1A1410">1st — size comes first</text>
  <text x="460" y="182" font-size="12.5" fill="#A85A4E">Buried behind expand</text>
  <text x="632" y="182" font-size="12.5" fill="#37848A">Icon at a glance</text>

  <!-- Row 2 -->
  <rect x="40" y="216" width="720" height="62" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="246" font-size="13.5" font-weight="600" fill="#1A1410">Bay type — Remote / Frontal</text>
  <text x="56" y="264" font-size="11.5" fill="#8A8480">Buses vs jet bridge logistics</text>
  <text x="300" y="254" font-size="12.5" fill="#1A1410">2nd — logistics on demand</text>
  <text x="460" y="254" font-size="12.5" fill="#A85A4E">Buried behind expand</text>
  <text x="632" y="254" font-size="12.5" fill="#37848A">Dot + icon on expansion</text>

  <!-- Row 3 -->
  <rect x="40" y="288" width="720" height="62" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="318" font-size="13.5" font-weight="600" fill="#1A1410">PTS events &amp; stand details</text>
  <text x="56" y="336" font-size="11.5" fill="#8A8480">Acted on, not scanned</text>
  <text x="300" y="326" font-size="12.5" fill="#1A1410">3rd — act-time detail</text>
  <text x="460" y="326" font-size="12.5" fill="#A85A4E">Expand-only</text>
  <text x="632" y="326" font-size="12.5" fill="#37848A">Revealed on expansion</text>

  <!-- Row 4 -->
  <rect x="40" y="360" width="720" height="62" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="390" font-size="13.5" font-weight="600" fill="#1A1410">Whole-board state</text>
  <text x="56" y="408" font-size="11.5" fill="#8A8480">Scanned every 2–3 min at peak</text>
  <text x="300" y="398" font-size="12.5" fill="#1A1410">Continuous scan</text>
  <text x="460" y="398" font-size="12.5" fill="#A85A4E">Rhythm broken by clicks</text>
  <text x="632" y="398" font-size="12.5" fill="#37848A">Rhythm preserved</text>

  <text x="40" y="458" font-size="12" fill="#B8B2AE">AS2 · AAHK Controller Dashboard — Phase 3 revamp</text>
</svg>
