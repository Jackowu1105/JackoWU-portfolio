<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#454549"/>
      <stop offset="1" stop-color="#37848A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C9A74D"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="56" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">TOUCHPOINT MAP · BANGKOK OFFICE BUILDINGS</text>
  <text x="40" y="88" font-size="22" font-weight="700" fill="#1A1410">Four fragmented touchpoints, one tenant experience</text>

  <!-- Before: fragmented touchpoints -->
  <text x="40" y="106" font-size="11" letter-spacing="1.5" fill="#B8B2AE" font-weight="600">BEFORE — SCATTERED CHANNELS</text>
  <g>
    <rect x="40" y="118" width="330" height="58" rx="12" fill="#FFFFFF" stroke="#D4C5B0" stroke-dasharray="4 3" stroke-opacity="0.8"/>
    <text x="60" y="142" font-size="14" font-weight="700" fill="#1A1410">Maintenance requests</text>
    <text x="60" y="162" font-size="11" fill="#5A554F">phone + email, no tracking</text>

    <rect x="40" y="186" width="330" height="58" rx="12" fill="#FFFFFF" stroke="#D4C5B0" stroke-dasharray="4 3" stroke-opacity="0.8"/>
    <text x="60" y="210" font-size="14" font-weight="700" fill="#1A1410">Visitor check-in</text>
    <text x="60" y="230" font-size="11" fill="#5A554F">paper forms, 10–15 min</text>

    <rect x="40" y="254" width="330" height="58" rx="12" fill="#FFFFFF" stroke="#D4C5B0" stroke-dasharray="4 3" stroke-opacity="0.8"/>
    <text x="60" y="278" font-size="14" font-weight="700" fill="#1A1410">Loyalty program</text>
    <text x="60" y="298" font-size="11" fill="#5A554F">15% participation, low awareness</text>

    <rect x="40" y="322" width="330" height="58" rx="12" fill="#FFFFFF" stroke="#D4C5B0" stroke-dasharray="4 3" stroke-opacity="0.8"/>
    <text x="60" y="346" font-size="14" font-weight="700" fill="#1A1410">Merchant offers</text>
    <text x="60" y="366" font-size="11" fill="#5A554F">no channel to reach tenants</text>
  </g>

  <!-- After: unified app -->
  <text x="480" y="106" font-size="11" letter-spacing="1.5" fill="#B8B2AE" font-weight="600">AFTER — ONE APP, FOUR TABS</text>
  <rect x="480" y="118" width="280" height="262" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="504" y="150" font-size="16" font-weight="700" fill="#1A1410">AWC Connext</text>
  <text x="504" y="172" font-size="11" fill="#5A554F">tenant · visitor · management · merchant</text>

  <rect x="504" y="190" width="232" height="38" rx="10" fill="#EDF0F5" stroke="#C7D0DA"/>
  <text x="620" y="214" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Home — dashboard</text>
  <rect x="504" y="236" width="232" height="38" rx="10" fill="#EDF0F5" stroke="#C7D0DA"/>
  <text x="620" y="260" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Services — requests</text>
  <rect x="504" y="282" width="232" height="38" rx="10" fill="#EDF0F5" stroke="#C7D0DA"/>
  <text x="620" y="306" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Access — QR pass + visitors</text>
  <rect x="504" y="328" width="232" height="38" rx="10" fill="#EDF0F5" stroke="#C7D0DA"/>
  <text x="620" y="352" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Rewards — gamified loyalty</text>

  <!-- Converging connectors -->
  <g stroke="#C9A74D" stroke-width="2" fill="none" opacity="0.8" marker-end="url(#arrow)">
    <path d="M370 147 L474 195"/>
    <path d="M370 215 L474 255"/>
    <path d="M370 283 L474 300"/>
    <path d="M370 351 L474 346"/>
  </g>

  <!-- Research base strip -->
  <rect x="40" y="408" width="720" height="70" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="60" y="434" font-size="11" letter-spacing="1.5" fill="#B8B2AE" font-weight="600">RESEARCH BASE</text>
  <text x="60" y="456" font-size="13" fill="#5A554F">8 stakeholder interviews · 15 tenant interviews · 10+ observed requests &amp; check-ins</text>
  <text x="60" y="474" font-size="13" fill="#5A554F">6 competitor apps (WeWork, Equinox, The Great Room) · 120-response tenant survey</text>

  <text x="40" y="506" font-size="12" fill="#B8B2AE">AWC Connext · tenant research synthesis</text>
</svg>
