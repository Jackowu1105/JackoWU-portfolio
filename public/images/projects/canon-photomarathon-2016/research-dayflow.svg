<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="cacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37848A"/>
      <stop offset="1" stop-color="#C9A74D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="24" fill="url(#cbg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#cacc)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">SINGLE-DAY EVENT TIMELINE</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">One day, two journeys — capture, upload, judge, select</text>

  <g font-size="12" font-weight="600">
    <rect x="40" y="118" width="170" height="34" rx="8" fill="#A2CACD" opacity="0.4"/>
    <text x="125" y="139" fill="#2F5B5F" text-anchor="middle">CAPTURE</text>
    <rect x="226" y="118" width="170" height="34" rx="8" fill="#D9C9A8" opacity="0.55"/>
    <text x="311" y="139" fill="#7A6230" text-anchor="middle">UPLOAD WINDOW</text>
    <rect x="412" y="118" width="170" height="34" rx="8" fill="#A2CACD" opacity="0.4"/>
    <text x="497" y="139" fill="#2F5B5F" text-anchor="middle">JUDGING WINDOW</text>
    <rect x="598" y="118" width="162" height="34" rx="8" fill="#D9C9A8" opacity="0.55"/>
    <text x="679" y="139" fill="#7A6230" text-anchor="middle">SELECTION</text>
  </g>
  <text x="40" y="172" font-size="12" fill="#8A8480">Participants race the upload deadline · judges work the queue under the clock</text>

  <text x="40" y="200" font-size="13" font-weight="700" letter-spacing="1.5" fill="#37848A">PARTICIPANTS · MOBILE</text>
  <text x="40" y="218" font-size="11" fill="#8A8480">smartphones · inconsistent connectivity</text>
  <text x="540" y="200" font-size="13" font-weight="700" letter-spacing="1.5" fill="#A77C30">JUDGES · DESKTOP</text>
  <text x="540" y="218" font-size="11" fill="#8A8480">full-screen grid · hours to score</text>

  <!-- Participant steps -->
  <g font-size="13" font-weight="600" fill="#1A1410">
    <rect x="40" y="236" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="50" y="245" width="20" height="20" rx="6" fill="#37848A"/>
    <text x="60" y="259" font-size="11" fill="#fff" text-anchor="middle">1</text>
    <text x="82" y="260">Registration</text>

    <rect x="40" y="284" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="50" y="293" width="20" height="20" rx="6" fill="#37848A"/>
    <text x="60" y="307" font-size="11" fill="#fff" text-anchor="middle">2</text>
    <text x="82" y="308">Photo Capture</text>

    <rect x="40" y="332" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="50" y="341" width="20" height="20" rx="6" fill="#37848A"/>
    <text x="60" y="355" font-size="11" fill="#fff" text-anchor="middle">3</text>
    <text x="82" y="356">Upload Initiation</text>

    <rect x="40" y="380" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="50" y="389" width="20" height="20" rx="6" fill="#37848A"/>
    <text x="60" y="403" font-size="11" fill="#fff" text-anchor="middle">4</text>
    <text x="82" y="404">File Selection</text>

    <rect x="40" y="428" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="50" y="437" width="20" height="20" rx="6" fill="#37848A"/>
    <text x="60" y="451" font-size="11" fill="#fff" text-anchor="middle">5</text>
    <text x="82" y="452">Validation — real-time</text>

    <rect x="40" y="476" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="50" y="485" width="20" height="20" rx="6" fill="#37848A"/>
    <text x="60" y="499" font-size="11" fill="#fff" text-anchor="middle">6</text>
    <text x="82" y="500">Submission Confirmation</text>
  </g>

  <!-- Judge steps -->
  <g font-size="13" font-weight="600" fill="#1A1410">
    <rect x="540" y="236" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="550" y="245" width="20" height="20" rx="6" fill="#C9A74D"/>
    <text x="560" y="259" font-size="11" fill="#fff" text-anchor="middle">1</text>
    <text x="582" y="260">Login</text>

    <rect x="540" y="284" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="550" y="293" width="20" height="20" rx="6" fill="#C9A74D"/>
    <text x="560" y="307" font-size="11" fill="#fff" text-anchor="middle">2</text>
    <text x="582" y="308">Image Queue</text>

    <rect x="540" y="332" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="550" y="341" width="20" height="20" rx="6" fill="#C9A74D"/>
    <text x="560" y="355" font-size="11" fill="#fff" text-anchor="middle">3</text>
    <text x="582" y="356">Review Grid</text>

    <rect x="540" y="380" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="550" y="389" width="20" height="20" rx="6" fill="#C9A74D"/>
    <text x="560" y="403" font-size="11" fill="#fff" text-anchor="middle">4</text>
    <text x="582" y="404">Filter &amp; Compare</text>

    <rect x="540" y="428" width="220" height="38" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="550" y="437" width="20" height="20" rx="6" fill="#C9A74D"/>
    <text x="560" y="451" font-size="11" fill="#fff" text-anchor="middle">5</text>
    <text x="582" y="452">Selection Finalisation</text>
  </g>

  <!-- Handoff: submission enters the queue -->
  <path d="M260 495 L540 255" stroke="#C9A74D" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.85"/>
  <polygon points="534,249 546,255 534,261" fill="#C9A74D"/>
  <rect x="315" y="363" width="170" height="24" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="400" y="379" font-size="12" fill="#5A554F" text-anchor="middle">photos enter the queue</text>

  <text x="40" y="540" font-size="12" fill="#B8B2AE">Canon PhotoMarathon 2016 · Single-day journey map — designed so neither side becomes the bottleneck</text>
</svg>
