<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C1710"/>
      <stop offset="1" stop-color="#C9A74D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="56" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">CONVERSION FUNNEL · SUMMER LUCKY DRAW</text>
  <text x="40" y="88" font-size="22" font-weight="700" fill="#1A1410">Progressive disclosure — engage first, ask later</text>

  <!-- Funnel bars -->
  <rect x="80" y="118" width="640" height="54" rx="12" fill="#1C1710"/>
  <text x="104" y="150" font-size="14" font-weight="600" fill="#FFFFFF">Landing — prizes + live counter</text>
  <text x="696" y="150" font-size="11" fill="#FFFFFF" fill-opacity="0.75" text-anchor="end">trust from the first screen</text>

  <rect x="130" y="184" width="540" height="54" rx="12" fill="#32291C"/>
  <text x="154" y="216" font-size="14" font-weight="600" fill="#FFFFFF">Browse &amp; select products</text>
  <text x="646" y="216" font-size="11" fill="#FFFFFF" fill-opacity="0.75" text-anchor="end">gallery + smart filters</text>

  <rect x="180" y="250" width="440" height="54" rx="12" fill="#32291C"/>
  <text x="204" y="282" font-size="14" font-weight="600" fill="#FFFFFF">Minimal form — name + email</text>
  <text x="596" y="282" font-size="11" fill="#FFFFFF" fill-opacity="0.75" text-anchor="end">nothing else asked</text>

  <rect x="230" y="316" width="340" height="54" rx="12" fill="#C9A74D"/>
  <text x="254" y="348" font-size="14" font-weight="600" fill="#FFFFFF">Instant confirmation</text>
  <text x="546" y="348" font-size="11" fill="#FFFFFF" fill-opacity="0.85" text-anchor="end">unique entry ID + email</text>

  <!-- Drop labels between bars -->
  <g font-size="11" fill="#B8B2AE" text-anchor="middle">
    <text x="400" y="174">▼</text>
    <text x="400" y="240">▼</text>
    <text x="400" y="306">▼</text>
  </g>

  <text x="40" y="398" font-size="14" fill="#5A554F">Competitor baseline: forms asking too much upfront → high abandonment · most traffic was mobile.</text>
  <text x="40" y="420" font-size="14" fill="#5A554F">Trust at every step: live participant counter · clear T&amp;Cs with draw date · confirmation email with entry ID.</text>

  <text x="40" y="456" font-size="12" fill="#B8B2AE">c!ty'super Summer Lucky Draw · campaign research</text>
</svg>
