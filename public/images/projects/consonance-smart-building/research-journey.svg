<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A74D"/>
      <stop offset="1" stop-color="#37848A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="410" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">RESIDENT JOURNEY · SMART BUILDING PLUS</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">A day in the life — before and after</text>

  <!-- Card 1: Morning rush / Access -->
  <rect x="40" y="120" width="172" height="230" rx="16" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="146" font-size="10.5" letter-spacing="1.5" font-weight="600" fill="#B8B2AE">ACCESS CONTROL</text>
  <text x="56" y="172" font-size="14.5" font-weight="700" fill="#1A1410">Morning rush</text>
  <line x1="56" y1="186" x2="196" y2="186" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="56" y="206" font-size="10" letter-spacing="1.5" font-weight="600" fill="#A85A4E">BEFORE</text>
  <text x="56" y="224" font-size="12" fill="#5A554F">Fumble for a key card</text>
  <text x="56" y="242" font-size="12" fill="#5A554F">at the lobby</text>
  <text x="56" y="276" font-size="10" letter-spacing="1.5" font-weight="600" fill="#37848A">AFTER</text>
  <text x="56" y="294" font-size="12" fill="#5A554F">One QR scan</text>
  <text x="56" y="312" font-size="12" fill="#5A554F">to get in</text>

  <!-- Card 2: Coming home / App -->
  <rect x="224" y="120" width="172" height="230" rx="16" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="240" y="146" font-size="10.5" letter-spacing="1.5" font-weight="600" fill="#B8B2AE">RESIDENT APP</text>
  <text x="240" y="172" font-size="14.5" font-weight="700" fill="#1A1410">Coming home</text>
  <line x1="240" y1="186" x2="380" y2="186" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="240" y="206" font-size="10" letter-spacing="1.5" font-weight="600" fill="#A85A4E">BEFORE</text>
  <text x="240" y="224" font-size="12" fill="#5A554F">Door, lift and air-con —</text>
  <text x="240" y="242" font-size="12" fill="#5A554F">three separate steps</text>
  <text x="240" y="276" font-size="10" letter-spacing="1.5" font-weight="600" fill="#37848A">AFTER</text>
  <text x="240" y="294" font-size="12" fill="#5A554F">One “coming home” flow</text>
  <text x="240" y="312" font-size="12" fill="#5A554F">sets the apartment</text>

  <!-- Card 3: Weekend clubhouse / Kiosk -->
  <rect x="408" y="120" width="172" height="230" rx="16" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="424" y="146" font-size="10.5" letter-spacing="1.5" font-weight="600" fill="#B8B2AE">KIOSK</text>
  <text x="424" y="172" font-size="14.5" font-weight="700" fill="#1A1410">Weekend clubhouse</text>
  <line x1="424" y1="186" x2="564" y2="186" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="424" y="206" font-size="10" letter-spacing="1.5" font-weight="600" fill="#A85A4E">BEFORE</text>
  <text x="424" y="224" font-size="12" fill="#5A554F">Call the office</text>
  <text x="424" y="242" font-size="12" fill="#5A554F">during business hours</text>
  <text x="424" y="276" font-size="10" letter-spacing="1.5" font-weight="600" fill="#37848A">AFTER</text>
  <text x="424" y="294" font-size="12" fill="#5A554F">Self-serve booking</text>
  <text x="424" y="312" font-size="12" fill="#5A554F">at the lobby kiosk</text>

  <!-- Card 4: Poolside / Locker -->
  <rect x="592" y="120" width="172" height="230" rx="16" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="608" y="146" font-size="10.5" letter-spacing="1.5" font-weight="600" fill="#B8B2AE">POOL LOCKER</text>
  <text x="608" y="172" font-size="14.5" font-weight="700" fill="#1A1410">Poolside</text>
  <line x1="608" y1="186" x2="748" y2="186" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="608" y="206" font-size="10" letter-spacing="1.5" font-weight="600" fill="#A85A4E">BEFORE</text>
  <text x="608" y="224" font-size="12" fill="#5A554F">Carry keys</text>
  <text x="608" y="242" font-size="12" fill="#5A554F">to the pool</text>
  <text x="608" y="276" font-size="10" letter-spacing="1.5" font-weight="600" fill="#37848A">AFTER</text>
  <text x="608" y="294" font-size="12" fill="#5A554F">App assigns &amp; opens</text>
  <text x="608" y="312" font-size="12" fill="#5A554F">a locker on arrival</text>

  <text x="40" y="386" font-size="12" fill="#B8B2AE">One QR system across lobby, clubhouse, mailbox and locker — every touchpoint mapped to a daily ritual</text>
</svg>
