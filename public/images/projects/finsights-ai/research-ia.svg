<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="acc5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9F9BA0"/>
      <stop offset="1" stop-color="#C9A74D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="24" fill="url(#bg5)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#acc5)"/>

  <text x="40" y="54" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">INFORMATION ARCHITECTURE</text>
  <text x="40" y="84" font-size="20" font-weight="700" fill="#1A1410">Three surfaces, each mapped to one user intent</text>

  <!-- AI assistant - front door -->
  <rect x="280" y="110" width="240" height="50" rx="14" fill="#1A1410"/>
  <text x="400" y="141" font-size="15" fill="#fff" text-anchor="middle" font-weight="600">AI Assistant · front door</text>

  <g font-size="14" font-weight="600" fill="#1A1410">
    <rect x="60" y="200" width="200" height="60" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="160" y="235" text-anchor="middle">Home</text>
    <text x="160" y="255" text-anchor="middle" font-size="11" font-weight="400" fill="#8A8480">tabs · own collection</text>

    <rect x="300" y="200" width="200" height="60" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="400" y="235" text-anchor="middle">AI Assistant</text>
    <text x="400" y="255" text-anchor="middle" font-size="11" font-weight="400" fill="#8A8480">conversational advisor</text>

    <rect x="540" y="200" width="200" height="60" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="640" y="235" text-anchor="middle">Market</text>
    <text x="640" y="255" text-anchor="middle" font-size="11" font-weight="400" fill="#8A8480">data backbone</text>
  </g>

  <g stroke="#C9A74D" stroke-width="2" fill="none" opacity="0.7">
    <path d="M400 160 L160 200"/>
    <path d="M400 160 L400 200"/>
    <path d="M400 160 L640 200"/>
  </g>

  <text x="40" y="320" font-size="14" fill="#5A554F">The assistant sits at the front door — not a portfolio dashboard — because the</text>
  <text x="40" y="344" font-size="14" fill="#5A554F">product’s thesis is: the assistant is the product, the data is the reference.</text>
  <text x="40" y="388" font-size="12" fill="#B8B2AE">FinSightsAI · IA decision that resolved the trust/simplicity tension</text>
</svg>