<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FUNDel — 揀 Cover 圖</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #faf7f5; font-family: Inter, system-ui, sans-serif; padding: 40px 24px 80px; color: #1c1814; }
  h1 { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 6px; }
  .sub { text-align: center; color: #8a8480; font-size: 14px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; border: 1px solid rgba(0,0,0,0.08); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
  .card .imgwrap { background: #f5f1ec; aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .cap { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .card .cap .name { font-weight: 700; font-size: 14px; }
  .card .cap .tag { font-size: 11px; color: #8a8480; }
  .cur { border: 3px solid #c9a74d; }
</style>
</head>
<body>
  <h1>FUNDel — 揀邊張做 Cover？</h1>
  <p class="sub">金色邊 = 而家嘅 cover · 話我知 gXX 編號就得</p>
  <div class="grid">
    <div class="card cur">
      <div class="imgwrap"><img src="cover.jpg" alt="current cover" /></div>
      <div class="cap"><span class="name">cover.jpg</span><span class="tag">現時 cover</span></div>
    </div>
    <div class="card"><div class="imgwrap"><img src="g01.jpg" alt="g01" /></div><div class="cap"><span class="name">g01</span><span class="tag">Login</span></div></div>
    <div class="card"><div class="imgwrap"><img src="g02.jpg" alt="g02" /></div><div class="cap"><span class="name">g02</span><span class="tag">Operator Dashboard</span></div></div>
    <div class="card"><div class="imgwrap"><img src="g03.jpg" alt="g03" /></div><div class="cap"><span class="name">g03</span><span class="tag">Shipments</span></div></div>
    <div class="card"><div class="imgwrap"><img src="g04.jpg" alt="g04" /></div><div class="cap"><span class="name">g04</span><span class="tag">Shipment Detail</span></div></div>
    <div class="card"><div class="imgwrap"><img src="g05.jpg" alt="g05" /></div><div class="cap"><span class="name">g05</span><span class="tag">Document Preview</span></div></div>
    <div class="card"><div class="imgwrap"><img src="g06.jpg" alt="g06" /></div><div class="cap"><span class="name">g06</span><span class="tag">Finance Solutions</span></div></div>
    <div class="card"><div class="imgwrap"><img src="g07.jpg" alt="g07" /></div><div class="cap"><span class="name">g07</span><span class="tag">Carbon / Sustainability</span></div></div>
    <div class="card"><div class="imgwrap"><img src="g08.jpg" alt="g08" /></div><div class="cap"><span class="name">g08</span><span class="tag">Shipper Dashboard</span></div></div>
    <div class="card"><div class="imgwrap"><img src="g09.jpg" alt="g09" /></div><div class="cap"><span class="name">g09</span><span class="tag">AI Assistant</span></div></div>
  </div>
</body>
</html>
