<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="acc6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#41B893"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" rx="24" fill="url(#bg6)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#acc6)"/>

  <text x="40" y="54" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">ONE PRODUCT · TWO ROLES</text>
  <text x="40" y="84" font-size="20" font-weight="700" fill="#1A1410">The IA that avoided the split-product trap</text>

  <!-- single SPA root -->
  <rect x="320" y="110" width="160" height="46" rx="12" fill="#0F172A"/>
  <text x="400" y="138" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">One SPA</text>

  <!-- two roles -->
  <rect x="60" y="200" width="300" height="100" rx="14" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="84" y="232" font-size="15" font-weight="700" fill="#1A1410">OPERATOR</text>
  <text x="84" y="258" font-size="13" fill="#5A554F">Shipments · Documents · Finance</text>
  <text x="84" y="280" font-size="13" fill="#5A554F">Carbon · one shared data model</text>

  <rect x="440" y="200" width="300" height="100" rx="14" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="464" y="232" font-size="15" font-weight="700" fill="#1A1410">SHIPPER</text>
  <text x="464" y="258" font-size="13" fill="#5A554F">Quote · Telemetry read · Act</text>
  <text x="464" y="280" font-size="13" fill="#5A554F">Re-skinned by role state</text>

  <g stroke="#41B893" stroke-width="2" fill="none" opacity="0.7">
    <path d="M400 156 L210 200"/>
    <path d="M400 156 L590 200"/>
  </g>

  <rect x="60" y="320" width="680" height="40" rx="10" fill="#0F172A" opacity="0.06"/>
  <text x="400" y="345" font-size="14" fill="#3D3833" text-anchor="middle">One source of truth · one deploy · one AI assistant mounted on both</text>

  <text x="40" y="372" font-size="12" fill="#B8B2AE">FUNDel · IA decision that kept the two user populations in sync</text>
</svg>