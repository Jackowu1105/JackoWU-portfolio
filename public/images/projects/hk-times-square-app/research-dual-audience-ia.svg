<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="acc6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37848A"/>
      <stop offset="1" stop-color="#C9A74D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg6)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#acc6)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">DUAL-AUDIENCE INFORMATION ARCHITECTURE</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">Two apps, one system</text>

  <!-- Column headers -->
  <text x="200" y="140" font-size="12" font-weight="600" letter-spacing="2" fill="#B8B2AE" text-anchor="middle">SHOPPER APP</text>
  <text x="600" y="140" font-size="12" font-weight="600" letter-spacing="2" fill="#B8B2AE" text-anchor="middle">STAFF APP</text>

  <!-- Shopper column -->
  <rect x="40" y="160" width="320" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="200" y="187" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Before the visit</text>
  <text x="200" y="222" font-size="12" fill="#8A8480" text-anchor="middle">offers · events · directory from home</text>

  <rect x="40" y="240" width="320" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="200" y="267" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Inside the mall</text>
  <text x="200" y="302" font-size="12" fill="#8A8480" text-anchor="middle">wayfinding · store discovery on the move</text>

  <rect x="40" y="320" width="320" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="200" y="347" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">On the spot</text>
  <text x="200" y="382" font-size="12" fill="#8A8480" text-anchor="middle">parking · bookings · promotions</text>

  <!-- Staff column -->
  <rect x="440" y="160" width="320" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="600" y="187" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Task lists</text>
  <text x="600" y="222" font-size="12" fill="#8A8480" text-anchor="middle">clear states · quick actions</text>

  <rect x="440" y="240" width="320" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="600" y="267" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Status updates</text>
  <text x="600" y="302" font-size="12" fill="#8A8480" text-anchor="middle">operational clarity across shifts</text>

  <rect x="440" y="320" width="320" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="600" y="347" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Checklists</text>
  <text x="600" y="382" font-size="12" fill="#8A8480" text-anchor="middle">one-handed use during busy shifts</text>

  <text x="40" y="410" font-size="14" fill="#5A554F">Rejected: a single app with a role toggle — two mental models, one compromise.</text>
  <text x="40" y="432" font-size="14" fill="#5A554F">Shoppers scan, staff tap; the shared component library keeps one brand across both.</text>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">Hong Kong Times Square · Two apps, one system</text>
</svg>
