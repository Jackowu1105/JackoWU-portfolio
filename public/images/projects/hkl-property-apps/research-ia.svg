  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">MULTI-ESTATE IA COMPARISON</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">Same core flows, three estate skins</text>

  <!-- Estate headers -->
