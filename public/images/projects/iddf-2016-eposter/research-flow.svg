<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="iacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A77C30"/>
      <stop offset="1" stop-color="#FDD676"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="24" fill="url(#ibg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#iacc)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">EPOSTER BROWSING FLOW · KIOSK</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">From “where is it?” to bookmarked — in seconds</text>

  <!-- Home -->
  <rect x="330" y="118" width="140" height="46" rx="14" fill="#1A1410"/>
  <text x="400" y="141" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Kiosk Home</text>
  <text x="400" y="157" font-size="10.5" fill="#D8D2CC" text-anchor="middle">walk-up · no download</text>

  <!-- Entry cards -->
  <g font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">
    <rect x="40" y="196" width="160" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="120" y="224">Browse by Topic</text>
    <text x="120" y="242" font-size="10.5" font-weight="500" fill="#8A8480">medical specialties</text>

    <rect x="216" y="196" width="160" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="296" y="224">Search</text>
    <text x="296" y="242" font-size="10.5" font-weight="500" fill="#8A8480">topic · institution · author</text>

    <rect x="392" y="196" width="160" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="472" y="224">My Bookmarks</text>
    <text x="472" y="242" font-size="10.5" font-weight="500" fill="#8A8480">saved posters</text>

    <rect x="568" y="196" width="160" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="648" y="224">Trending Posters</text>
    <text x="648" y="242" font-size="10.5" font-weight="500" fill="#8A8480">most popular</text>
  </g>

  <!-- Fan out -->
  <g stroke="#C9A74D" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M400 164 L120 196"/>
    <path d="M400 164 L296 196"/>
    <path d="M400 164 L472 196"/>
    <path d="M400 164 L648 196"/>
  </g>

  <!-- Converge -->
  <g stroke="#C9A74D" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.7">
    <path d="M120 252 L120 284"/>
    <path d="M296 252 L296 284"/>
    <path d="M472 252 L472 284"/>
    <path d="M648 252 L648 284"/>
  </g>

  <!-- List view -->
  <rect x="40" y="284" width="720" height="68" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="400" y="312" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">List view — one poster per row, large preview</text>
  <text x="400" y="334" font-size="12" fill="#5A554F" text-anchor="middle">grouped by medical specialty — calm and scannable (the grid felt overwhelming)</text>

  <!-- Detail -->
  <path d="M400 352 L400 374" stroke="#C9A74D" stroke-width="2" fill="none"/>
  <polygon points="394,368 406,368 400,378" fill="#C9A74D"/>
  <rect x="40" y="380" width="720" height="58" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="400" y="408" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Poster detail — full abstract + bookmark</text>
  <text x="400" y="430" font-size="12" fill="#5A554F" text-anchor="middle">bookmarked posters collect in My Bookmarks</text>

  <!-- Lucky draw loop -->
  <rect x="40" y="462" width="720" height="46" rx="12" fill="#FBF6EC" stroke="#C9A74D" stroke-opacity="0.5"/>
  <text x="56" y="486" font-size="11" font-weight="700" letter-spacing="1" fill="#A77C30">LUCKY DRAW · TABLET</text>
  <g font-size="11.5" font-weight="600" fill="#7A6230" text-anchor="middle">
    <rect x="230" y="470" width="110" height="26" rx="13" fill="#fff" stroke="#C9A74D" stroke-opacity="0.6"/>
    <text x="285" y="487">Scan badge QR</text>
    <rect x="356" y="470" width="100" height="26" rx="13" fill="#fff" stroke="#C9A74D" stroke-opacity="0.6"/>
    <text x="406" y="487">Auto-fill info</text>
    <rect x="472" y="470" width="124" height="26" rx="13" fill="#fff" stroke="#C9A74D" stroke-opacity="0.6"/>
    <text x="534" y="487">3-question survey</text>
    <rect x="612" y="470" width="110" height="26" rx="13" fill="#fff" stroke="#C9A74D" stroke-opacity="0.6"/>
    <text x="667" y="487">Submit → entry #</text>
  </g>
  <text x="350" y="488" font-size="13" fill="#C9A74D" text-anchor="middle">→</text>
  <text x="466" y="488" font-size="13" fill="#C9A74D" text-anchor="middle">→</text>
  <text x="608" y="488" font-size="13" fill="#C9A74D" text-anchor="middle">→</text>

  <text x="40" y="544" font-size="12" fill="#B8B2AE">IDDF 2016 · ePoster kiosk — universal icons (search, bookmark, back) bridge language barriers · large touch targets for crowded venues</text>
</svg>
