<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A4D5F1"/>
      <stop offset="1" stop-color="#5EB7E5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#ac)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">BOOTH SYSTEM</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">Two product zones, one AIFT frame</text>

  <!-- Booth frame -->
  <rect x="40" y="116" width="520" height="206" rx="16" fill="#fff" stroke="#1A1410" stroke-width="1.5"/>
  <text x="60" y="142" font-size="11" letter-spacing="1.5" fill="#1A1410" font-weight="700">AIFT VISUAL LANGUAGE — TYPE · COLOUR · HIERARCHY</text>

  <!-- Zone A -->
  <rect x="60" y="156" width="480" height="68" rx="10" fill="#D9EEFA"/>
  <text x="300" y="184" font-size="15" font-weight="700" fill="#2E5E8C" text-anchor="middle">FinSightsAI</text>
  <text x="300" y="204" font-size="12" fill="#5A554F" text-anchor="middle">product zone — own voice, own accent</text>

  <!-- Zone B -->
  <rect x="60" y="234" width="480" height="68" rx="10" fill="#A4D5F1"/>
  <text x="300" y="262" font-size="15" font-weight="700" fill="#1A3D5C" text-anchor="middle">TOLO</text>
  <text x="300" y="282" font-size="12" fill="#5A554F" text-anchor="middle">product zone — own voice, own accent</text>

  <!-- Material cards -->
  <rect x="590" y="116" width="170" height="96" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="610" y="142" font-size="11" letter-spacing="1" fill="#8A8480" font-weight="700">A4 LEAFLET</text>
  <text x="610" y="164" font-size="12" fill="#5A554F">one per product</text>
  <text x="610" y="184" font-size="12" fill="#5A554F">consistent type +</text>
  <text x="610" y="206" font-size="12" fill="#5A554F">hierarchy</text>

  <rect x="590" y="218" width="170" height="92" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="610" y="244" font-size="11" letter-spacing="1" fill="#8A8480" font-weight="700">PULL-UP BANNER</text>
  <text x="610" y="266" font-size="12" fill="#5A554F">850×2000</text>
  <text x="610" y="286" font-size="12" fill="#5A554F">legible at distance</text>

  <text x="40" y="352" font-size="13" fill="#5A554F">Separating the products lets visitors focus on one at a time;</text>
  <text x="40" y="372" font-size="13" fill="#5A554F">the shared visual language keeps the booth reading as one AIFT presence.</text>

  <!-- Palette -->
  <g font-size="11" fill="#8A8480">
    <rect x="40" y="392" width="22" height="22" rx="6" fill="#D9EEFA"/>
    <text x="72" y="408">Sky</text>
    <rect x="150" y="392" width="22" height="22" rx="6" fill="#A4D5F1"/>
    <text x="182" y="408">Blue Light</text>
    <rect x="260" y="392" width="22" height="22" rx="6" fill="#5EB7E5"/>
    <text x="292" y="408">Blue</text>
    <rect x="370" y="392" width="22" height="22" rx="6" fill="#6994CC"/>
    <text x="402" y="408">Blue Mid</text>
  </g>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">InnoEX 2025 · AIFT booth — FinSightsAI and TOLO under one visual language</text>
</svg>
