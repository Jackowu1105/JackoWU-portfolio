<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6895C7"/>
      <stop offset="1" stop-color="#E39972"/>
    </linearGradient>
    <linearGradient id="mock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5D9E7"/>
      <stop offset="1" stop-color="#6895C7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#ac)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">DESIGN DIRECTION</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">Cool blue base, warm coral signal</text>

  <!-- Backdrop mock -->
  <rect x="40" y="116" width="340" height="212" rx="16" fill="url(#mock)"/>
  <text x="210" y="164" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">AIFT</text>
  <text x="210" y="190" font-size="11" fill="#fff" text-anchor="middle" opacity="0.9" letter-spacing="1.5">PRODUCT LINE — INNOEX 2026</text>
  <rect x="90" y="224" width="150" height="10" rx="5" fill="#E39972"/>
  <circle cx="246" cy="240" r="26" fill="#E39972" opacity="0.85"/>
  <text x="210" y="300" font-size="11" fill="#fff" text-anchor="middle" opacity="0.9">large-format backdrop — the booth main anchor</text>

  <!-- Continuity card -->
  <rect x="410" y="116" width="350" height="98" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <rect x="430" y="130" width="104" height="20" rx="6" fill="#D5D9E7"/>
  <text x="482" y="144" font-size="10" letter-spacing="1.5" fill="#2E4E7A" text-anchor="middle" font-weight="700">CONTINUITY</text>
  <text x="430" y="172" font-size="14" font-weight="600" fill="#1A1410">Cool blue base</text>
  <text x="430" y="192" font-size="12" fill="#5A554F">#D5D9E7 · #ACBEDB · #6895C7 — carries</text>
  <text x="430" y="208" font-size="12" fill="#5A554F">the 2025 brand equity forward.</text>

  <!-- Refresh card -->
  <rect x="410" y="228" width="350" height="98" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <rect x="430" y="242" width="104" height="20" rx="6" fill="#E39972" opacity="0.18"/>
  <text x="482" y="256" font-size="10" letter-spacing="1.5" fill="#C86A3F" text-anchor="middle" font-weight="700">REFRESH</text>
  <text x="430" y="284" font-size="14" font-weight="600" fill="#1A1410">Warm coral accent</text>
  <text x="430" y="304" font-size="12" fill="#5A554F">#E39972 — the signal that something</text>
  <text x="430" y="320" font-size="12" fill="#5A554F">is new for 2026, without breaking the brand.</text>

  <text x="40" y="356" font-size="13" fill="#8A8480">Rejected: repeating the 2025 blue palette — reads as a repeat, not a direction.</text>

  <!-- Palette -->
  <g font-size="11" fill="#8A8480">
    <rect x="40" y="380" width="22" height="22" rx="6" fill="#D5D9E7"/>
    <text x="72" y="396">Surface</text>
    <rect x="150" y="380" width="22" height="22" rx="6" fill="#E39972"/>
    <text x="182" y="396">Coral</text>
    <rect x="260" y="380" width="22" height="22" rx="6" fill="#ACBEDB"/>
    <text x="292" y="396">Blue Light</text>
    <rect x="370" y="380" width="22" height="22" rx="6" fill="#6895C7"/>
    <text x="402" y="396">Blue</text>
  </g>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">InnoEX 2026 · AIFT booth backdrop — V1 in progress, the system evolves toward the event</text>
</svg>
