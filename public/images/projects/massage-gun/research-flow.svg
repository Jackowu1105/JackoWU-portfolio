<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="macc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#187CDA"/>
      <stop offset="1" stop-color="#6FB1EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="24" fill="url(#mbg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#macc)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">USAGE SCENARIO FLOW</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">From recovery need to guided session</text>

  <!-- Scenarios -->
  <g text-anchor="middle">
    <rect x="40" y="118" width="220" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="150" y="146" font-size="14" font-weight="600" fill="#1A1410">After a workout</text>
    <text x="150" y="165" font-size="11.5" fill="#8A8480">muscle recovery</text>

    <rect x="290" y="118" width="220" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="400" y="146" font-size="14" font-weight="600" fill="#1A1410">Sore muscles</text>
    <text x="400" y="165" font-size="11.5" fill="#8A8480">pain relief</text>

    <rect x="540" y="118" width="220" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="650" y="146" font-size="14" font-weight="600" fill="#1A1410">Wind-down</text>
    <text x="650" y="165" font-size="11.5" fill="#8A8480">relaxation</text>
  </g>

  <path d="M400 174 L400 202" stroke="#187CDA" stroke-width="2" fill="none"/>
  <polygon points="394,196 406,196 400,206" fill="#187CDA"/>

  <!-- Programs -->
  <rect x="40" y="208" width="720" height="48" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="400" y="232" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Programs library</text>
  <text x="400" y="250" font-size="12" fill="#5A554F" text-anchor="middle">recovery · pain relief · relaxation — intensity, mode and target area customisable</text>

  <path d="M400 256 L400 280" stroke="#187CDA" stroke-width="2" fill="none"/>
  <polygon points="394,274 406,274 400,284" fill="#187CDA"/>

  <!-- Session flow -->
  <g font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">
    <rect x="40" y="286" width="136" height="66" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="48" y="294" width="18" height="18" rx="5" fill="#187CDA"/>
    <text x="57" y="307" font-size="11" fill="#fff">1</text>
    <text x="108" y="324">Quick-start</text>
    <text x="108" y="342" font-size="11" font-weight="500" fill="#8A8480">recommended session</text>

    <rect x="188" y="286" width="136" height="66" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="196" y="294" width="18" height="18" rx="5" fill="#187CDA"/>
    <text x="205" y="307" font-size="11" fill="#fff">2</text>
    <text x="256" y="324">Follow the guide</text>
    <text x="256" y="342" font-size="11" font-weight="500" fill="#8A8480">safety steps</text>

    <rect x="336" y="286" width="136" height="66" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="344" y="294" width="18" height="18" rx="5" fill="#187CDA"/>
    <text x="353" y="307" font-size="11" fill="#fff">3</text>
    <text x="404" y="324">Customise</text>
    <text x="404" y="342" font-size="11" font-weight="500" fill="#8A8480">one tap away</text>

    <rect x="484" y="286" width="136" height="66" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="492" y="294" width="18" height="18" rx="5" fill="#187CDA"/>
    <text x="501" y="307" font-size="11" fill="#fff">4</text>
    <text x="552" y="324">Session complete</text>
    <text x="552" y="342" font-size="11" font-weight="500" fill="#8A8480">safe, guided finish</text>

    <rect x="632" y="286" width="136" height="66" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <rect x="640" y="294" width="18" height="18" rx="5" fill="#187CDA"/>
    <text x="649" y="307" font-size="11" fill="#fff">5</text>
    <text x="700" y="324">Progress tracked</text>
    <text x="700" y="342" font-size="11" font-weight="500" fill="#8A8480">history + improvement</text>
  </g>

  <g font-size="15" fill="#187CDA" text-anchor="middle">
    <text x="182" y="320">→</text>
    <text x="330" y="320">→</text>
    <text x="478" y="320">→</text>
    <text x="626" y="320">→</text>
  </g>

  <rect x="40" y="380" width="720" height="34" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="402" font-size="13" fill="#5A554F">Customisation without clutter — first-time users see a simple surface; advanced settings stay one tap away.</text>

  <rect x="40" y="428" width="720" height="34" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="450" font-size="13" fill="#5A554F">The Guide carries step-by-step tutorials with safety precautions — users build confidence before they start.</text>

  <rect x="40" y="476" width="720" height="34" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="498" font-size="13" fill="#5A554F">Mid-session use — large, legible, high-contrast controls, glanceable while the device is in hand.</text>

  <text x="40" y="542" font-size="12" fill="#B8B2AE">Smart Massage Gun · Companion app — progress turns a one-off device into a daily habit</text>
</svg>
