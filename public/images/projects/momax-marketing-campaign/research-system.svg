<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accentM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0195E2"/>
      <stop offset="1" stop-color="#1A2F47"/>
    </linearGradient>
  </defs>
  <rect width="800" height="540" rx="24" fill="url(#bgM)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accentM)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">CAMPAIGN SYSTEM MAP</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">One visual language, five surface groups</text>

  <!-- Hub -->
  <rect x="280" y="126" width="240" height="60" rx="12" fill="#0195E2"/>
  <text x="400" y="154" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Campaign System</text>
  <text x="400" y="174" font-size="11" fill="#E6F4FC" text-anchor="middle">colour · typography · core motif</text>

  <!-- Connectors -->
  <g stroke="#0195E2" stroke-width="2" fill="none" opacity="0.45">
    <path d="M400 186 L112 254"/>
    <path d="M400 186 L264 254"/>
    <path d="M400 186 L416 254"/>
    <path d="M400 186 L568 254"/>
    <path d="M400 186 L720 254"/>
  </g>

  <!-- Surface cards -->
  <g>
    <rect x="40" y="254" width="144" height="92" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="112" y="284" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Social feed</text>
    <text x="112" y="306" font-size="10.5" fill="#8A8480" text-anchor="middle">Facebook posts</text>

    <rect x="192" y="254" width="144" height="92" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="264" y="284" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Event print</text>
    <text x="264" y="306" font-size="10.5" fill="#8A8480" text-anchor="middle">posters · tokens</text>

    <rect x="344" y="254" width="144" height="92" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="416" y="284" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Digital surfaces</text>
    <text x="416" y="306" font-size="10.5" fill="#8A8480" text-anchor="middle">app banners · in-app graphics</text>

    <rect x="496" y="254" width="144" height="92" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="568" y="284" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Large format</text>
    <text x="568" y="306" font-size="10.5" fill="#8A8480" text-anchor="middle">EV charger backdrop</text>

    <rect x="648" y="254" width="144" height="92" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="720" y="284" font-size="13" font-weight="600" fill="#1A1410" text-anchor="middle">Handout print</text>
    <text x="720" y="306" font-size="10.5" fill="#8A8480" text-anchor="middle">A5 leaflet · A4 posters</text>
  </g>

  <text x="40" y="390" font-size="13" fill="#5A554F">Locked first: MOMAX brand blue, bold headline type and the core motif — the visual language</text>
  <text x="40" y="414" font-size="13" fill="#5A554F">every surface inherits. Layout adapts per surface; colour, motif and typography stay constant.</text>
  <text x="40" y="438" font-size="13" fill="#5A554F">A Facebook post, a token and a 3-metre backdrop all read as the same campaign instantly.</text>

  <text x="40" y="520" font-size="12" fill="#B8B2AE">MOMAX · Marketing event campaign — materials system map</text>
</svg>
