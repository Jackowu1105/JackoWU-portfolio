<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37848A"/>
      <stop offset="1" stop-color="#C9A74D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg2)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent2)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">INFORMATION ARCHITECTURE</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">Reorganised around the user’s mental model</text>

  <!-- Root -->
  <rect x="320" y="120" width="160" height="48" rx="12" fill="#1A1410"/>
  <text x="400" y="149" font-size="15" fill="#fff" text-anchor="middle" font-weight="600">MOMAX App</text>

  <!-- 4 sections -->
  <g font-size="14" font-weight="600" fill="#1A1410">
    <rect x="40" y="220" width="160" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="120" y="253" text-anchor="middle">Home</text>
    <rect x="240" y="220" width="160" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="320" y="253" text-anchor="middle">Rooms</text>
    <rect x="440" y="220" width="160" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="520" y="253" text-anchor="middle">Automation</text>
    <rect x="640" y="220" width="160" height="56" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="720" y="253" text-anchor="middle">Settings</text>
  </g>

  <!-- Connectors -->
  <g stroke="#C9A74D" stroke-width="2" fill="none" opacity="0.7">
    <path d="M400 168 L120 220"/>
    <path d="M400 168 L320 220"/>
    <path d="M400 168 L520 220"/>
    <path d="M400 168 L720 220"/>
  </g>

  <!-- sub labels -->
  <g font-size="12" fill="#8A8480" text-anchor="middle">
    <text x="120" y="300">favourites · 1-tap</text>
    <text x="320" y="300">by location, not type</text>
    <text x="520" y="300">scenes + schedules</text>
    <text x="720" y="300">account · devices</text>
  </g>

  <text x="40" y="360" font-size="14" fill="#5A554F">Before: flat list of ~15 menu items → decision paralysis.</text>
  <text x="40" y="384" font-size="14" fill="#5A554F">After: 4 primary sections mapped to how users think. Card-sorting</text>
  <text x="40" y="408" font-size="14" fill="#5A554F">with ~10 users confirmed strong agreement with the new IA.</text>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">MOMAX Smart App · Information Architecture redesign</text>
</svg>