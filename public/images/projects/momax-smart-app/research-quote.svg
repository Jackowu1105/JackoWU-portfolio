  <text x="100" y="120" font-size="22" font-style="italic" fill="#F1F5F9">Setup took ages and I gave up the first time.</text>
  <text x="100" y="158" font-size="22" font-style="italic" fill="#F1F5F9">If it doesn’t connect in two minutes, I’m done.</text>
