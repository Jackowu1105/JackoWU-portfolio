<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AD203A"/>
      <stop offset="1" stop-color="#C9A74D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="470" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">CHANNEL CONSOLIDATION</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">From fragmented touchpoints to one estate-aware app</text>

  <!-- Before panel -->
  <rect x="40" y="120" width="340" height="280" rx="16" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="60" y="146" font-size="11" letter-spacing="1.5" font-weight="600" fill="#A85A4E">BEFORE — FRAGMENTED</text>
  <rect x="60" y="166" width="300" height="36" rx="10" fill="#FAF7F4" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="76" y="189" font-size="12.5" fill="#1A1410">Physical notice boards</text>
  <rect x="60" y="210" width="300" height="36" rx="10" fill="#FAF7F4" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="76" y="233" font-size="12.5" fill="#1A1410">Separate estate platforms</text>
  <rect x="60" y="254" width="300" height="36" rx="10" fill="#FAF7F4" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="76" y="277" font-size="12.5" fill="#1A1410">Management office calls</text>
  <rect x="60" y="298" width="300" height="36" rx="10" fill="#FAF7F4" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="76" y="321" font-size="12.5" fill="#1A1410">Repeated log in / log out</text>
  <rect x="60" y="334" width="300" height="60" rx="10" fill="#FBF6F1" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="76" y="356" font-size="12.5" font-weight="700" fill="#1A1410">Mrs. Chan — multi-estate owner</text>
  <text x="76" y="375" font-size="11" font-style="italic" fill="#5A554F">“I have to log in and out constantly,</text>
  <text x="76" y="391" font-size="11" font-style="italic" fill="#5A554F">and I forget which app is for which estate.”</text>

  <!-- Arrow -->
  <path d="M386 260 L414 260" stroke="#C9A74D" stroke-width="3" fill="none"/>
  <path d="M406 252 L417 260 L406 268" stroke="#C9A74D" stroke-width="3" fill="none"/>

  <!-- After panel -->
  <rect x="420" y="120" width="340" height="280" rx="16" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="440" y="146" font-size="11" letter-spacing="1.5" font-weight="600" fill="#37848A">AFTER — ONE APP</text>
  <rect x="440" y="166" width="300" height="64" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="456" y="192" font-size="13.5" font-weight="700" fill="#1A1410">One MTR Property App</text>
  <text x="456" y="212" font-size="11.5" fill="#5A554F">Auto-detects estate — loads theme &amp; content</text>
  <rect x="440" y="244" width="300" height="44" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="456" y="271" font-size="12.5" fill="#5A554F">Universal features — maintenance, booking</text>
  <rect x="440" y="296" width="300" height="44" rx="10" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="456" y="323" font-size="12.5" fill="#5A554F">Estate identity — events, notices, theme</text>
  <circle cx="452" cy="358" r="5" fill="#C9A74D"/>
  <text x="466" y="362" font-size="12.5" font-weight="600" fill="#1A1410">Seamless switcher — no re-login</text>

  <text x="40" y="436" font-size="12" fill="#B8B2AE">Research: estate-manager interviews, 15 resident interviews across 5 estates, competitive</text>
  <text x="40" y="456" font-size="12" fill="#B8B2AE">analysis, and contextual inquiry of how residents access estate information</text>
</svg>
