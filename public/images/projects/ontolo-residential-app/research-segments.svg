<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57A3B1"/>
      <stop offset="1" stop-color="#42677E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">RESIDENT SEGMENTS · DUAL-MODE APP</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">Three generations, one app</text>
  <text x="40" y="114" font-size="14" font-style="italic" fill="#5A554F">“Simplify by default, expand on demand.”</text>

  <!-- Segments -->
  <rect x="40" y="130" width="200" height="80" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="54" y="158" font-size="13" font-weight="700" fill="#1A1410">Elderly residents 60+</text>
  <text x="54" y="180" font-size="11.5" fill="#5A554F">Overwhelmed by options,</text>
  <text x="54" y="194" font-size="11.5" fill="#5A554F">small touch targets, fear</text>
  <text x="54" y="208" font-size="11.5" fill="#5A554F">of mistakes</text>

  <rect x="40" y="222" width="200" height="80" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="54" y="250" font-size="13" font-weight="700" fill="#1A1410">Children 8–12</text>
  <text x="54" y="272" font-size="11.5" fill="#5A554F">Visual, icon-based nav,</text>
  <text x="54" y="286" font-size="11.5" fill="#5A554F">needs supervision, no</text>
  <text x="54" y="300" font-size="11.5" fill="#5A554F">payments or lease info</text>

  <rect x="40" y="314" width="200" height="80" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="54" y="342" font-size="13" font-weight="700" fill="#1A1410">Adults</text>
  <text x="54" y="364" font-size="11.5" fill="#5A554F">Full community services,</text>
  <text x="54" y="378" font-size="11.5" fill="#5A554F">account management,</text>
  <text x="54" y="392" font-size="11.5" fill="#5A554F">modern, feature-rich</text>

  <!-- Shared core -->
  <rect x="300" y="170" width="200" height="170" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="314" y="198" font-size="13" font-weight="700" fill="#1A1410">Shared core</text>
  <text x="314" y="216" font-size="10" letter-spacing="1.5" font-weight="600" fill="#8A8480">WHAT EVERYONE USES</text>
  <text x="314" y="240" font-size="11.5" fill="#5A554F">Emergency contacts,</text>
  <text x="314" y="256" font-size="11.5" fill="#5A554F">facility booking,</text>
  <text x="314" y="272" font-size="11.5" fill="#5A554F">announcements, visitor</text>
  <text x="314" y="288" font-size="11.5" fill="#5A554F">access, service</text>
  <text x="314" y="304" font-size="11.5" fill="#5A554F">requests — the Pareto core</text>

  <!-- Modes -->
  <rect x="560" y="130" width="200" height="110" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="574" y="158" font-size="13" font-weight="700" fill="#1A1410">Simplified Mode</text>
  <text x="574" y="180" font-size="11.5" fill="#5A554F">5 core functions,</text>
  <text x="574" y="196" font-size="11.5" fill="#5A554F">60×60pt touch targets,</text>
  <text x="574" y="212" font-size="11.5" fill="#5A554F">WCAG AAA (7:1),</text>
  <text x="574" y="228" font-size="11.5" fill="#5A554F">max 2-level navigation</text>

  <rect x="560" y="252" width="200" height="110" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="574" y="280" font-size="13" font-weight="700" fill="#1A1410">Full Mode</text>
  <text x="574" y="302" font-size="11.5" fill="#5A554F">15+ functions,</text>
  <text x="574" y="318" font-size="11.5" fill="#5A554F">standard platform patterns,</text>
  <text x="574" y="334" font-size="11.5" fill="#5A554F">advanced account</text>
  <text x="574" y="350" font-size="11.5" fill="#5A554F">management</text>

  <!-- Connectors -->
  <g stroke="#C9A74D" stroke-width="2" fill="none" opacity="0.7">
    <path d="M240 170 L300 230"/>
    <path d="M240 262 L300 255"/>
    <path d="M240 354 L300 280"/>
    <path d="M500 240 L560 185"/>
    <path d="M500 270 L560 307"/>
  </g>

  <text x="40" y="424" font-size="12" fill="#B8B2AE">About 20 resident interviews (ages 8–75), contextual inquiry, and tests of existing apps</text>
</svg>
