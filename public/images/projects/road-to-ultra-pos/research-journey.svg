<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2D1D44"/>
      <stop offset="1" stop-color="#C9A74D"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2D1D44"/>
    </marker>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="56" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">FIELD RESEARCH · TWO MENTAL MODELS</text>
  <text x="40" y="88" font-size="22" font-weight="700" fill="#1A1410">Attendee and vendor flows, side by side</text>

  <!-- Attendee lane -->
  <rect x="40" y="108" width="720" height="128" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <rect x="60" y="124" width="96" height="24" rx="12" fill="#2D1D44"/>
  <text x="108" y="140" font-size="10" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">ATTENDEE</text>
  <text x="172" y="141" font-size="15" font-style="italic" fill="#3D3833">“How much do I have left?”</text>

  <rect x="60" y="162" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="130" y="186" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Join queue</text>
  <text x="130" y="202" font-size="10" fill="#8A8480" text-anchor="middle">peak-hour rush</text>
  <rect x="220" y="162" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="290" y="186" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Tap wristband</text>
  <text x="290" y="202" font-size="10" fill="#8A8480" text-anchor="middle">RFID, no cash</text>
  <rect x="380" y="162" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="450" y="186" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">See balance</text>
  <text x="450" y="202" font-size="10" fill="#8A8480" text-anchor="middle">always on screen</text>
  <rect x="540" y="162" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="610" y="186" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Top up / done</text>
  <text x="610" y="202" font-size="10" fill="#8A8480" text-anchor="middle">no cash anxiety</text>

  <g stroke="#2D1D44" stroke-width="2" fill="none" opacity="0.7" marker-end="url(#arrow)">
    <path d="M204 188 L214 188"/>
    <path d="M364 188 L374 188"/>
    <path d="M524 188 L534 188"/>
  </g>

  <!-- Vendor lane -->
  <rect x="40" y="256" width="720" height="128" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <rect x="60" y="272" width="96" height="24" rx="12" fill="#2D1D44"/>
  <text x="108" y="288" font-size="10" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">VENDOR</text>
  <text x="172" y="289" font-size="15" font-style="italic" fill="#3D3833">“Did the payment go through?”</text>

  <rect x="60" y="310" width="120" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="120" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Idle</text>
  <text x="120" y="350" font-size="10" fill="#8A8480" text-anchor="middle">waiting</text>
  <rect x="195" y="310" width="120" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="255" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">RFID scan</text>
  <text x="255" y="350" font-size="10" fill="#8A8480" text-anchor="middle">pulsing indicator</text>
  <rect x="330" y="310" width="120" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="390" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">One-tap amount</text>
  <text x="390" y="350" font-size="10" fill="#8A8480" text-anchor="middle">preset buttons</text>
  <rect x="465" y="310" width="120" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="525" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Confirm + haptic</text>
  <text x="525" y="350" font-size="10" fill="#8A8480" text-anchor="middle">visual + feedback</text>
  <rect x="600" y="310" width="120" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="660" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Success / Error</text>
  <text x="660" y="350" font-size="10" fill="#8A8480" text-anchor="middle">clear state</text>

  <g stroke="#2D1D44" stroke-width="2" fill="none" opacity="0.7" marker-end="url(#arrow)">
    <path d="M184 336 L189 336"/>
    <path d="M319 336 L324 336"/>
    <path d="M454 336 L459 336"/>
    <path d="M589 336 L594 336"/>
  </g>

  <text x="40" y="414" font-size="14" fill="#5A554F">Speed is everything — every tap counts in a peak-hour queue.</text>
  <text x="40" y="438" font-size="14" fill="#5A554F">Design levers: extra-large touch targets · WCAG AAA contrast for direct sunlight · haptic + visual feedback</text>

  <text x="40" y="474" font-size="12" fill="#B8B2AE">Road To Ultra Hong Kong 2016 · RFID cashless POS · research synthesis</text>
</svg>
