<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="acc1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44BBDC"/>
      <stop offset="1" stop-color="#37848A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg1)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#acc1)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">MIXED INTERFACE STRUCTURE</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">Conversation and data on one surface</text>

  <!-- Root: LLM assistant home -->
  <rect x="280" y="118" width="240" height="48" rx="12" fill="#1A1410"/>
  <text x="400" y="147" font-size="15" fill="#fff" text-anchor="middle" font-weight="600">LLM Assistant · Home</text>

  <!-- Three surfaces -->
  <g>
    <rect x="40" y="210" width="220" height="78" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="150" y="240" font-size="14" font-weight="700" fill="#1A1410" text-anchor="middle">Chat</text>
    <text x="150" y="262" font-size="12" fill="#5A554F" text-anchor="middle">ask about assets in</text>
    <text x="150" y="280" font-size="12" fill="#5A554F" text-anchor="middle">natural language</text>

    <rect x="290" y="210" width="220" height="78" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="400" y="240" font-size="14" font-weight="700" fill="#1A1410" text-anchor="middle">Asset List</text>
    <text x="400" y="262" font-size="12" fill="#5A554F" text-anchor="middle">browse · search · scan</text>
    <text x="400" y="280" font-size="12" fill="#5A554F" text-anchor="middle">for users who prefer to look</text>

    <rect x="540" y="210" width="220" height="78" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="650" y="240" font-size="14" font-weight="700" fill="#1A1410" text-anchor="middle">Asset Calculator</text>
    <text x="650" y="262" font-size="12" fill="#5A554F" text-anchor="middle">run calculations</text>
    <text x="650" y="280" font-size="12" fill="#5A554F" text-anchor="middle">also a referenced action</text>
  </g>

  <!-- Connectors -->
  <g stroke="#44BBDC" stroke-width="2" fill="none" opacity="0.7">
    <path d="M360 166 L150 210"/>
    <path d="M400 166 L400 210"/>
    <path d="M440 166 L650 210"/>
  </g>

  <!-- Roles -->
  <g font-size="12" fill="#8A8480" text-anchor="middle">
    <text x="150" y="316">the front door</text>
    <text x="400" y="316">the structured reference</text>
    <text x="650" y="316">the independent tool</text>
  </g>

  <text x="40" y="366" font-size="14" fill="#5A554F">Rejected: a separate AI page — it forces users to leave their assets</text>
  <text x="40" y="390" font-size="14" fill="#5A554F">to ask about their assets. The assistant answers and acts; the list</text>
  <text x="40" y="414" font-size="14" fill="#5A554F">and calculator sit beside it so the two paths stay connected.</text>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">SCF Supply Chain Finance · LLM-first home with structured companions</text>
</svg>
