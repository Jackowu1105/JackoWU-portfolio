<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="acc5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6DFE8"/>
      <stop offset="1" stop-color="#454549"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#454549"/>
    </marker>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg5)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#acc5)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">CROSS-ECOSYSTEM INTEGRATION FLOW</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">From MOMAX hardware to an HKBN-native device</text>

  <!-- Flow nodes -->
  <rect x="40" y="150" width="150" height="88" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="115" y="182" font-size="14" font-weight="700" fill="#1A1410" text-anchor="middle">MOMAX Smart</text>
  <text x="115" y="206" font-size="12" fill="#5A554F" text-anchor="middle">own pairing flow</text>
  <text x="115" y="224" font-size="12" fill="#5A554F" text-anchor="middle">own naming · own controls</text>

  <rect x="230" y="150" width="150" height="88" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="305" y="182" font-size="14" font-weight="700" fill="#1A1410" text-anchor="middle">HKBN pairing</text>
  <text x="305" y="206" font-size="12" fill="#5A554F" text-anchor="middle">entirely HKBN-branded</text>
  <text x="305" y="224" font-size="12" fill="#5A554F" text-anchor="middle">device recognised natively</text>

  <rect x="420" y="150" width="150" height="88" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="495" y="182" font-size="14" font-weight="700" fill="#1A1410" text-anchor="middle">App control</text>
  <text x="495" y="206" font-size="12" fill="#5A554F" text-anchor="middle">device cards · toggles</text>
  <text x="495" y="224" font-size="12" fill="#5A554F" text-anchor="middle">states in HKBN’s language</text>

  <rect x="610" y="150" width="150" height="88" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="685" y="182" font-size="14" font-weight="700" fill="#1A1410" text-anchor="middle">Voice control</text>
  <text x="685" y="206" font-size="12" fill="#5A554F" text-anchor="middle">Google Assistant</text>
  <text x="685" y="224" font-size="12" fill="#5A554F" text-anchor="middle">Alexa</text>

  <!-- Arrows -->
  <g stroke="#454549" stroke-width="2" fill="none" opacity="0.7">
    <line x1="190" y1="194" x2="222" y2="194" marker-end="url(#arr)"/>
    <line x1="380" y1="194" x2="412" y2="194" marker-end="url(#arr)"/>
    <line x1="570" y1="194" x2="602" y2="194" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" fill="#8A8480" text-anchor="middle">
    <text x="210" y="182">pair</text>
    <text x="400" y="182">control</text>
    <text x="590" y="182">voice</text>
  </g>

  <!-- Ecosystem band -->
  <rect x="40" y="286" width="720" height="56" rx="12" fill="#454549" opacity="0.06"/>
  <text x="400" y="312" font-size="14" fill="#3D3833" text-anchor="middle">One ecosystem: the device feels like it was always part of HKBN</text>
  <text x="400" y="332" font-size="12" fill="#5A554F" text-anchor="middle">same device states and scenes reachable by app and by voice</text>

  <text x="40" y="384" font-size="14" fill="#5A554F">Rejected: two-step brand-aware pairing — customers saw one device with</text>
  <text x="40" y="408" font-size="14" fill="#5A554F">two identities. HKBN-native pairing presents the device as part of the app.</text>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">Smart D · MOMAX × HKBN ecosystem integration</text>
</svg>
