<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E64A7"/>
      <stop offset="1" stop-color="#D93E61"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#ac)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">VISUAL SYSTEM</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">Official blue, competition energy</text>

  <!-- Two pillars -->
  <rect x="40" y="116" width="340" height="92" rx="14" fill="#2E64A7"/>
  <text x="210" y="150" font-size="14" letter-spacing="1.5" fill="#fff" text-anchor="middle" font-weight="700">CONFIDENT BLUE</text>
  <text x="210" y="174" font-size="12" fill="#fff" text-anchor="middle" opacity="0.9">#2E64A7 · #3170C1 — the official tone</text>

  <rect x="420" y="116" width="340" height="92" rx="14" fill="#D93E61"/>
  <text x="590" y="150" font-size="14" letter-spacing="1.5" fill="#fff" text-anchor="middle" font-weight="700">VIVID PINK-RED</text>
  <text x="590" y="174" font-size="12" fill="#fff" text-anchor="middle" opacity="0.9">#D93E61 — the competition energy</text>

  <!-- Materials -->
  <g>
    <rect x="40" y="238" width="160" height="88" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="60" y="264" font-size="11" letter-spacing="1" fill="#8A8480" font-weight="700">BACKDROP</text>
    <text x="60" y="286" font-size="12" fill="#5A554F">main visual anchor,</text>
    <text x="60" y="304" font-size="12" fill="#5A554F">large-format scale</text>

    <rect x="215" y="238" width="160" height="88" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="235" y="264" font-size="11" letter-spacing="1" fill="#8A8480" font-weight="700">ROLL-UP</text>
    <text x="235" y="286" font-size="12" fill="#5A554F">portable signage,</text>
    <text x="235" y="304" font-size="12" fill="#5A554F">legible at distance</text>

    <rect x="390" y="238" width="160" height="88" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="410" y="264" font-size="11" letter-spacing="1" fill="#8A8480" font-weight="700">RUNDOWN</text>
    <text x="410" y="286" font-size="12" fill="#5A554F">the schedule —</text>
    <text x="410" y="304" font-size="12" fill="#5A554F">information hierarchy</text>

    <rect x="565" y="238" width="160" height="88" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
    <text x="585" y="264" font-size="11" letter-spacing="1" fill="#8A8480" font-weight="700">CERTIFICATE</text>
    <text x="585" y="286" font-size="12" fill="#5A554F">the takeaway —</text>
    <text x="585" y="304" font-size="12" fill="#5A554F">keepsake scale</text>
  </g>

  <text x="40" y="356" font-size="13" fill="#5A554F">One system, many configurations — hierarchy and colour rules built up front,</text>
  <text x="40" y="376" font-size="13" fill="#5A554F">so every material reads as one event on a tight timeline.</text>

  <!-- Palette -->
  <g font-size="11" fill="#8A8480">
    <rect x="40" y="398" width="22" height="22" rx="6" fill="#2E64A7"/>
    <text x="72" y="414">Blue</text>
    <rect x="150" y="398" width="22" height="22" rx="6" fill="#3170C1"/>
    <text x="182" y="414">Blue Light</text>
    <rect x="260" y="398" width="22" height="22" rx="6" fill="#D93E61"/>
    <text x="292" y="414">Pink Accent</text>
    <rect x="370" y="398" width="22" height="22" rx="6" fill="#2D3046"/>
    <text x="402" y="414">Navy</text>
  </g>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">Smart Logistics Datathon 2024 · AISCL × GOVHK — co-organised event identity</text>
</svg>
