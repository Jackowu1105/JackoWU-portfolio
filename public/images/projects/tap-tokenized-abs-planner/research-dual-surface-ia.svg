<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A74D"/>
      <stop offset="1" stop-color="#192F54"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" rx="24" fill="url(#bg2)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#acc2)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">DUAL-SURFACE INFORMATION ARCHITECTURE</text>
  <text x="40" y="90" font-size="22" font-weight="700" fill="#1A1410">One asset model, two vocabularies</text>

  <!-- Shared asset model -->
  <rect x="300" y="118" width="200" height="44" rx="12" fill="#192F54"/>
  <text x="400" y="145" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">Shared asset model</text>
  <text x="400" y="184" font-size="12" fill="#8A8480" text-anchor="middle">pools · tranches · tokens</text>

  <!-- Column headers -->
  <text x="140" y="232" font-size="12" font-weight="600" letter-spacing="2" fill="#B8B2AE" text-anchor="middle">INVESTOR SURFACE</text>
  <text x="660" y="232" font-size="12" font-weight="600" letter-spacing="2" fill="#B8B2AE" text-anchor="middle">ADMIN SURFACE</text>

  <!-- Cards -->
  <rect x="40" y="248" width="200" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="140" y="275" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Investor Planner</text>
  <rect x="560" y="248" width="200" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="660" y="275" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">RWA Admin</text>

  <rect x="40" y="314" width="200" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="140" y="341" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Overview + AI Assistant</text>
  <rect x="560" y="314" width="200" height="44" rx="12" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="660" y="341" font-size="14" font-weight="600" fill="#1A1410" text-anchor="middle">Financing Board</text>

  <!-- Connectors -->
  <g stroke="#C9A74D" stroke-width="2" fill="none" opacity="0.7">
    <path d="M330 162 L140 248"/>
    <path d="M330 162 L140 314"/>
    <path d="M470 162 L660 248"/>
    <path d="M470 162 L660 314"/>
  </g>

  <!-- Sub labels -->
  <g font-size="12" fill="#8A8480" text-anchor="middle">
    <text x="140" y="310">the front door</text>
    <text x="660" y="310">the back-office</text>
    <text x="140" y="376">home base · answers on screen</text>
    <text x="660" y="376">origination → settlement</text>
  </g>

  <text x="40" y="404" font-size="14" fill="#5A554F">Investors see coins and plans; admins see pools, tranches, and status.</text>
  <text x="40" y="426" font-size="14" fill="#5A554F">The IA keeps the two apart so neither leaks jargon into the other.</text>

  <text x="40" y="442" font-size="12" fill="#B8B2AE">TAP-X Tokenized ABS Planner · Dual-surface IA</text>
</svg>
