<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37848A"/>
      <stop offset="1" stop-color="#2C677A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C9A74D"/>
    </marker>
  </defs>
  <rect width="800" height="470" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="56" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">MONITORING WORKFLOW · AIRPORT APRON</text>
  <text x="40" y="88" font-size="22" font-weight="700" fill="#1A1410">From raw vehicle feed to priority alerts</text>

  <!-- Flow cards -->
  <rect x="40" y="118" width="165" height="118" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="60" y="146" font-size="11" letter-spacing="1.5" fill="#37848A" font-weight="600">01</text>
  <text x="60" y="170" font-size="15" font-weight="700" fill="#1A1410">Live feed</text>
  <text x="60" y="194" font-size="12" fill="#5A554F">All apron vehicles on</text>
  <text x="60" y="212" font-size="12" fill="#5A554F">one real-time map</text>

  <rect x="235" y="118" width="165" height="118" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="255" y="146" font-size="11" letter-spacing="1.5" fill="#37848A" font-weight="600">02</text>
  <text x="255" y="170" font-size="15" font-weight="700" fill="#1A1410">Filter first</text>
  <text x="255" y="194" font-size="12" fill="#5A554F">Toggle by zone, type</text>
  <text x="255" y="212" font-size="12" fill="#5A554F">or status — no clutter</text>

  <rect x="430" y="118" width="165" height="118" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="450" y="146" font-size="11" letter-spacing="1.5" fill="#37848A" font-weight="600">03</text>
  <text x="450" y="170" font-size="15" font-weight="700" fill="#1A1410">Map focus</text>
  <text x="450" y="194" font-size="12" fill="#5A554F">Custom GEO fences</text>
  <text x="450" y="212" font-size="12" fill="#5A554F">drawn per shift</text>

  <rect x="625" y="118" width="165" height="118" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="645" y="146" font-size="11" letter-spacing="1.5" fill="#37848A" font-weight="600">04</text>
  <text x="645" y="170" font-size="15" font-weight="700" fill="#1A1410">Priority alerts</text>
  <text x="645" y="194" font-size="12" fill="#5A554F">Smart-filtered,</text>
  <text x="645" y="212" font-size="12" fill="#5A554F">not alert fatigue</text>

  <!-- Connectors -->
  <g stroke="#C9A74D" stroke-width="2" fill="none" opacity="0.8" marker-end="url(#arrow)">
    <path d="M212 177 L228 177"/>
    <path d="M407 177 L423 177"/>
    <path d="M602 177 L618 177"/>
  </g>

  <!-- Alert levels -->
  <rect x="40" y="262" width="720" height="104" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="60" y="288" font-size="11" letter-spacing="1.5" fill="#B8B2AE" font-weight="600">ALERT LEVELS — ICON + COLOUR, NEVER COLOUR ALONE</text>
  <rect x="60" y="300" width="130" height="42" rx="10" fill="#2C677A"/>
  <text x="125" y="325" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">ACTIVE</text>
  <rect x="205" y="300" width="130" height="42" rx="10" fill="#E8E2DC" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="270" y="325" font-size="12" font-weight="600" fill="#5A554F" text-anchor="middle">IDLE</text>
  <rect x="350" y="300" width="130" height="42" rx="10" fill="#C9A74D"/>
  <text x="415" y="325" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">OFFLINE</text>
  <rect x="495" y="300" width="130" height="42" rx="10" fill="#B34A3C"/>
  <text x="560" y="325" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">ALERT</text>
  <text x="640" y="313" font-size="11" fill="#5A554F">priority-based,</text>
  <text x="640" y="329" font-size="11" fill="#5A554F">smart-filtered</text>

  <text x="40" y="396" font-size="14" fill="#5A554F">Before: radio + manual tracking with no real-time visibility → delayed response to unauthorised access.</text>
  <text x="40" y="418" font-size="14" fill="#5A554F">After: each shift filters the map to the zones and vehicle types it monitors — less clutter, faster decisions.</text>

  <text x="40" y="454" font-size="12" fill="#B8B2AE">GEO Fence Monitoring Platform · research synthesis</text>
</svg>
