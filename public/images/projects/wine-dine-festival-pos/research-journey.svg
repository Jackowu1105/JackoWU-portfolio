<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#494D5B"/>
      <stop offset="1" stop-color="#C2A77A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#494D5B"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="56" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">DUAL-ROLE JOURNEY · HONG KONG WINE &amp; DINE 2016</text>
  <text x="40" y="88" font-size="22" font-weight="700" fill="#1A1410">Two journeys, one resilient payment flow</text>

  <!-- Attendee lane -->
  <rect x="40" y="108" width="720" height="128" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <rect x="60" y="124" width="96" height="24" rx="12" fill="#494D5B"/>
  <text x="108" y="140" font-size="10" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">ATTENDEE</text>
  <text x="172" y="141" font-size="15" font-style="italic" fill="#3D3833">“Carrying cash + coupons was the pain — where's the balance?”</text>

  <rect x="60" y="162" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="130" y="186" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Top up tokens</text>
  <text x="130" y="202" font-size="10" fill="#8A8480" text-anchor="middle">RFID card</text>
  <rect x="220" y="162" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="290" y="186" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Tap &amp; pay</text>
  <text x="290" y="202" font-size="10" fill="#8A8480" text-anchor="middle">at any stall</text>
  <rect x="380" y="162" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="450" y="186" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Balance check</text>
  <text x="450" y="202" font-size="10" fill="#8A8480" text-anchor="middle">tablet, anytime</text>
  <rect x="540" y="162" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="610" y="186" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Spend freely</text>
  <text x="610" y="202" font-size="10" fill="#8A8480" text-anchor="middle">no cash handling</text>

  <g stroke="#494D5B" stroke-width="2" fill="none" opacity="0.7" marker-end="url(#arrow)">
    <path d="M204 188 L214 188"/>
    <path d="M364 188 L374 188"/>
    <path d="M524 188 L534 188"/>
  </g>

  <!-- Vendor lane -->
  <rect x="40" y="256" width="720" height="128" rx="14" fill="#FFFFFF" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <rect x="60" y="272" width="96" height="24" rx="12" fill="#494D5B"/>
  <text x="108" y="288" font-size="10" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">VENDOR</text>
  <text x="172" y="289" font-size="15" font-style="italic" fill="#3D3833">Part-time, non-tech — sunlight, noise, gloves, and flaky wifi</text>

  <rect x="60" y="310" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="130" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">RFID tap</text>
  <text x="130" y="350" font-size="10" fill="#8A8480" text-anchor="middle">token sale</text>
  <rect x="220" y="310" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="290" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Quick-select amount</text>
  <text x="290" y="350" font-size="10" fill="#8A8480" text-anchor="middle">+ custom keypad</text>
  <rect x="380" y="310" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="450" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">3-channel confirm</text>
  <text x="450" y="350" font-size="10" fill="#8A8480" text-anchor="middle">sound + haptic + visual</text>
  <rect x="540" y="310" width="140" height="52" rx="10" fill="#F5F0EB" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <text x="610" y="334" font-size="12" font-weight="600" fill="#1A1410" text-anchor="middle">Offline sync queue</text>
  <text x="610" y="350" font-size="10" fill="#8A8480" text-anchor="middle">visible sync state</text>

  <g stroke="#494D5B" stroke-width="2" fill="none" opacity="0.7" marker-end="url(#arrow)">
    <path d="M204 336 L214 336"/>
    <path d="M364 336 L374 336"/>
    <path d="M524 336 L534 336"/>
  </g>

  <!-- Resilience strip -->
  <rect x="40" y="404" width="720" height="76" rx="14" fill="#FFFFFF" stroke="#C2A77A" stroke-opacity="0.7"/>
  <text x="60" y="430" font-size="11" letter-spacing="1.5" fill="#B8B2AE" font-weight="600">OFFLINE-FIRST · THE DAY-2 TEST</text>
  <text x="60" y="452" font-size="14" fill="#5A554F">Wifi failed ~45 minutes during peak hours — the offline queue held 800+ transactions</text>
  <text x="60" y="472" font-size="14" fill="#5A554F">locally and synced them seamlessly when the connection returned.</text>

  <text x="40" y="506" font-size="12" fill="#B8B2AE">Hong Kong Wine &amp; Dine Festival 2016 · cashless RFID system · research synthesis</text>
</svg>
