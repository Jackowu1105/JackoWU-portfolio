<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F7"/>
      <stop offset="1" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EA7A9"/>
      <stop offset="1" stop-color="#FFDF91"/>
    </linearGradient>
  </defs>
  <rect width="800" height="540" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#accent)"/>

  <text x="40" y="58" font-size="13" letter-spacing="2" fill="#B8B2AE" font-weight="600">ROLE NEEDS MATRIX</text>
  <text x="40" y="92" font-size="22" font-weight="700" fill="#1A1410">One size fit nobody — two roles, two dashboards</text>

  <!-- Oliver card -->
  <rect x="40" y="118" width="350" height="300" rx="16" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="56" y="148" font-size="13.5" font-weight="700" fill="#1A1410">Operations Manager Oliver · 42</text>
  <text x="56" y="168" font-size="12" fill="#5A554F">Monitors performance — wants KPIs at a glance</text>
  <line x1="56" y1="184" x2="374" y2="184" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <g font-size="12.5" fill="#5A554F">
    <text x="56" y="214">KPIs at a glance</text>
    <text x="56" y="248">Cargo tracking</text>
    <text x="56" y="282">Real-time updates</text>
    <text x="56" y="316">Alerts &amp; anomalies</text>
    <text x="56" y="350">Bay optimisation</text>
  </g>
  <g>
    <!-- Oliver: ●●● ●○○ ●●○ ●●● ●●● -->
    <circle cx="330" cy="210" r="7" fill="#2EA7A9"/><circle cx="352" cy="210" r="7" fill="#2EA7A9"/><circle cx="374" cy="210" r="7" fill="#2EA7A9"/>
    <circle cx="330" cy="244" r="7" fill="#2EA7A9"/><circle cx="352" cy="244" r="7" fill="none" stroke="#D4C5B0" stroke-width="1.5"/><circle cx="374" cy="244" r="7" fill="none" stroke="#D4C5B0" stroke-width="1.5"/>
    <circle cx="330" cy="278" r="7" fill="#2EA7A9"/><circle cx="352" cy="278" r="7" fill="#2EA7A9"/><circle cx="374" cy="278" r="7" fill="none" stroke="#D4C5B0" stroke-width="1.5"/>
    <circle cx="330" cy="312" r="7" fill="#2EA7A9"/><circle cx="352" cy="312" r="7" fill="#2EA7A9"/><circle cx="374" cy="312" r="7" fill="#2EA7A9"/>
    <circle cx="330" cy="346" r="7" fill="#2EA7A9"/><circle cx="352" cy="346" r="7" fill="#2EA7A9"/><circle cx="374" cy="346" r="7" fill="#2EA7A9"/>
  </g>

  <!-- Clara card -->
  <rect x="410" y="118" width="350" height="300" rx="16" fill="#fff" stroke="#D4C5B0" stroke-opacity="0.5"/>
  <text x="426" y="148" font-size="13.5" font-weight="700" fill="#1A1410">Cargo Coordinator Clara · 35</text>
  <text x="426" y="168" font-size="12" fill="#5A554F">Manages cargo &amp; ground staff — real-time updates</text>
  <line x1="426" y1="184" x2="744" y2="184" stroke="#D4C5B0" stroke-opacity="0.6"/>
  <g font-size="12.5" fill="#5A554F">
    <text x="426" y="214">KPIs at a glance</text>
    <text x="426" y="248">Cargo tracking</text>
    <text x="426" y="282">Real-time updates</text>
    <text x="426" y="316">Alerts &amp; anomalies</text>
    <text x="426" y="350">Bay optimisation</text>
  </g>
  <g>
    <!-- Clara: ●○○ ●●● ●●● ●●○ ●○○ -->
    <circle cx="700" cy="210" r="7" fill="#2EA7A9"/><circle cx="722" cy="210" r="7" fill="none" stroke="#D4C5B0" stroke-width="1.5"/><circle cx="744" cy="210" r="7" fill="none" stroke="#D4C5B0" stroke-width="1.5"/>
    <circle cx="700" cy="244" r="7" fill="#2EA7A9"/><circle cx="722" cy="244" r="7" fill="#2EA7A9"/><circle cx="744" cy="244" r="7" fill="#2EA7A9"/>
    <circle cx="700" cy="278" r="7" fill="#2EA7A9"/><circle cx="722" cy="278" r="7" fill="#2EA7A9"/><circle cx="744" cy="278" r="7" fill="#2EA7A9"/>
    <circle cx="700" cy="312" r="7" fill="#2EA7A9"/><circle cx="722" cy="312" r="7" fill="#2EA7A9"/><circle cx="744" cy="312" r="7" fill="none" stroke="#D4C5B0" stroke-width="1.5"/>
    <circle cx="700" cy="346" r="7" fill="#2EA7A9"/><circle cx="722" cy="346" r="7" fill="none" stroke="#D4C5B0" stroke-width="1.5"/><circle cx="744" cy="346" r="7" fill="none" stroke="#D4C5B0" stroke-width="1.5"/>
  </g>

  <text x="40" y="452" font-size="14" fill="#5A554F">A fixed layout showed every widget to every airport — small airports drowned in irrelevant</text>
  <text x="40" y="476" font-size="14" fill="#5A554F">widgets while large hubs couldn’t surface their priority data. Modular widgets fixed both.</text>

  <text x="40" y="516" font-size="12" fill="#B8B2AE">zProduct Dashboard · Role needs matrix — from contextual inquiry and 12 interviews</text>
</svg>
